<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHBIM 工作台 · Prototype V1</title>
<style>
  :root { --bg:#fafafa; --panel:#fff; --border:#e5e7eb; --muted:#6b7280;
          --accent:#185fa5; --accent-soft:#e6f1fb; --danger:#a32d2d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Songti SC",
        "Helvetica Neue", Arial, sans-serif; color: #1f2328; background: var(--bg); }
  header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 15px; font-weight: 500; }
  header .tag { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 50px); }
  aside { background: var(--panel); border-right: 1px solid var(--border);
          padding: 16px; overflow-y: auto; }
  section.viewer { padding: 16px; overflow: auto; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  aside input { width: 100%; min-width: 0; padding: 6px 8px;
                border: 1px solid var(--border); border-radius: 6px;
                font-size: 14px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
           padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: progress; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  h3 { font-size: 13px; font-weight: 500; margin: 16px 0 8px; color: var(--muted); }
  h3.preview-head { display: flex; justify-content: space-between; align-items: center; }
  .btn-mini { background: var(--accent-soft); color: var(--accent); padding: 3px 12px;
              font-size: 12px; border-radius: 12px; }
  .btn-mini:hover:not(:disabled) { background: #d3e1f3; filter: none; }
  #status { font-size: 12px; color: var(--muted); margin: 8px 0; min-height: 18px; }
  #status.err { color: var(--danger); }
  .preview-box { background: #fff; border: 1px solid var(--border); border-radius: 8px;
                 padding: 12px; margin-bottom: 12px; }
  .preview-box h3 { margin-top: 0; }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            align-items: start; }
  .tables .preview-box { margin-bottom: 0; }
  .tables + .preview-box { margin-top: 12px; }
  #canvas3d { width: 100%; height: 360px; background: #f3f4f6; border-radius: 6px; }
  #preview { max-width: 100%; max-height: 240px; }
  .exports { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .exports a { background: var(--accent-soft); color: var(--accent); text-decoration: none;
               padding: 4px 10px; border-radius: 14px; font-size: 12px; }
  .exports a:hover { background: #d3e1f3; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sheet-img { max-width: 100%; border: 1px solid var(--border); border-radius: 4px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: #f3f4f6;
         padding: 1px 4px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>CHBIM 工作台</h1>
  <span class="tag">Prototype V1 · 以 OpenSCAD 为建模核心</span>
</header>
<main>
  <aside>
    <label>整体模数 D（柱径，mm）</label>
    <input id="D" type="number" value="300" step="10" min="50" max="2000">
    <label style="margin-top:8px">面阔间数 / 进深间数（奇数 ≥3）</label>
    <div style="display:flex;gap:8px">
      <input id="mianKuo" type="number" value="5" step="2" min="3" max="21"
             title="面阔间数（奇数）">
      <input id="jinShen" type="number" value="3" step="2" min="3" max="11"
             title="进深间数（奇数）">
    </div>
    <label style="margin-top:8px">明间面阔 / 明间进深（D 表达式）</label>
    <div style="display:flex;gap:8px">
      <input id="mingKuoW" type="text" value="8D" title="明间面阔，如 8D">
      <input id="mingShenW" type="text" value="8D" title="明间进深，如 8D">
    </div>
    <div style="margin-top:12px">
      <button id="build">生成</button>
    </div>
    <div id="status">点击「生成」——间宽自明间每向外一间 ×0.8；柱高 = 0.8×明间面阔（docs/coding-system.md G17）。</div>

    <h3>导出（stl / obj / svg / pdf）</h3>
    <div class="exports" id="exports">
      <span class="tag">生成模型后显示下载链接</span>
    </div>
  </aside>

  <section class="viewer">
    <div class="tables">
      <div class="preview-box">
        <h3>轴线（缝）</h3>
        <table id="axes-table">
          <thead><tr><th>id</th><th>kind</th><th>距中线</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="preview-box">
        <h3>构件</h3>
        <table id="members-table">
          <thead><tr><th>id</th><th>名称</th><th>x / y (mm)</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="preview-box">
      <h3 class="preview-head">3D 预览 <button id="reset-view" class="btn-mini">回正视角</button></h3>
      <div id="canvas3d"></div>
      <img id="preview" alt="OpenSCAD 渲染" style="display:none">
    </div>
    <div class="preview-box">
      <h3>图纸</h3>
      <figure>
        <img id="sheet" class="sheet-img" alt="三视图图纸" src="">
        <figcaption>三视图（第一角投影）· 边缘线 / 辅助线 · 图名 · 比例尺 · 日期</figcaption>
      </figure>
    </div>
  </section>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
const $ = s => document.querySelector(s);
const status = msg => { const el = $("#status"); el.classList.remove("err"); el.textContent = msg; };
const err    = msg => { const el = $("#status"); el.classList.add("err");    el.textContent = msg; };

// 三视图初装：拉数据
async function loadData() {
  try {
    const r = await fetch("/api/data");
    const data = await r.json();
    renderAxes(data.axes);
    renderMembers(data.member_types);
    if (data.default_D) $("#D").value = data.default_D;
  } catch (e) { err("加载数据失败：" + e.message); }
}
function renderAxes(axes) {
  const tb = $("#axes-table tbody"); tb.innerHTML = "";
  for (const a of axes) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><code>${a.id}</code></td><td>${a.kind}</td>
      <td>${a.distance}</td>`;
    tb.appendChild(tr);
  }
}
function renderMembers(types) {
  const tb = $("#members-table tbody"); tb.innerHTML = "";
  for (const t of types) {
    for (const i of t.instances) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><code>${i.id}</code></td>
        <td>${t.name}</td><td>— <span class="tag">待生成</span></td>`;
      tb.appendChild(tr);
    }
  }
}

// 生成（统一入口）：D + 面阔/进深间数 + 明间宽 → /api/layout → 全套产物
$("#build").onclick = async () => {
  const mian = parseInt($("#mianKuo").value);
  const shen = parseInt($("#jinShen").value);
  if (!mian || !shen) return err("请输入面阔与进深间数");
  const btn = $("#build"); btn.disabled = true;
  status("生成中（间数 → 缝位 → OpenSCAD 6 次调用，约 3-8 秒）…");
  try {
    const r = await fetch("/api/layout", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        D: parseFloat($("#D").value) || undefined,
        mian_kuo: mian, jin_shen: shen,
        ming_kuo_w: $("#mingKuoW").value.trim() || undefined,
        ming_shen_w: $("#mingShenW").value.trim() || undefined,
      }) });
    const result = await r.json();
    if (!r.ok) throw new Error(result.error || r.statusText);
    renderAxesResolved(result.spec.axes);
    renderMembersResolved(result.spec.members);
    renderFiles(result.files);
    status(`已生成 ${mian}间×${shen}间 柱网 · ${result.spec.members.length} 根柱`
      + ` · D=${result.spec.D}mm · 柱高 ${result.spec.members[0].height_mm.toFixed(0)}mm`);
    loadPreview();
    load3D();
  } catch (e) { err("生成失败：" + e.message); }
  finally { btn.disabled = false; }
};

function renderAxesResolved(axes) {
  // 生成布局后用 spec.axes（已解析坐标）刷新轴线表
  const tb = $("#axes-table tbody"); tb.innerHTML = "";
  for (const a of axes) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><code>${a.id}</code></td><td>${a.kind}</td>
      <td>${a.coord.toFixed(0)} mm</td>`;
    tb.appendChild(tr);
  }
}

function renderMembersResolved(members) {
  const tb = $("#members-table tbody"); tb.innerHTML = "";
  for (const m of members) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><code>${m.id}</code></td>
      <td>${m.name}</td><td>${m.x.toFixed(0)} / ${m.y.toFixed(0)}</td>`;
    tb.appendChild(tr);
  }
}

function renderFiles(files) {
  const box = $("#exports");
  box.innerHTML = "";
  for (const [k, v] of Object.entries(files)) {
    if (k === "spec") continue;
    const a = document.createElement("a");
    a.href = "/files/" + v.split("/").pop();
    a.textContent = k.toUpperCase();
    a.download = a.textContent + "-" + $("#D").value + "mm";
    box.appendChild(a);
  }
}

function loadPreview() {
  const img = $("#preview");
  img.src = "/files/preview.png?t=" + Date.now();
  img.style.display = "block";
  const sh = $("#sheet");
  sh.src = "/files/sheet.svg?t=" + Date.now();
}

let scene, camera, renderer, controls, defaultView;
async function load3D() {
  const canvasBox = $("#canvas3d");
  try {
    const THREE = await import("three");
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    if (renderer) { renderer.dispose(); canvasBox.innerHTML = ""; }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f4f6);
    const aspect = canvasBox.clientWidth / 360;
    camera = new THREE.PerspectiveCamera(50, aspect, 1, 100000);
    camera.position.set(3000, -3000, 2500);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(canvasBox.clientWidth, 360);
    canvasBox.appendChild(renderer.domElement);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 1000); controls.update();
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5000, -5000, 5000); scene.add(dir);
    // 网格尺寸在 loader 回调内按模型实际尺寸生成（先放占位，后面替换）
    let grid = new THREE.GridHelper(4000, 16, 0xcccccc, 0xe5e7eb);
    grid.position.y = -0.5; scene.add(grid);
    const loader = new STLLoader();
    loader.load("/files/model.stl?t=" + Date.now(), (geo) => {
      geo.rotateX(-Math.PI / 2);   // OpenSCAD Z-up → three.js Y-up（柱子冲上）
      geo.center();
      geo.computeBoundingBox();
      const box = geo.boundingBox;
      geo.translate(0, -box.min.y, 0);   // 柱底贴地，网格在脚下
      const h = box.max.y - box.min.y;  // 建筑总高
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial(
        { color: 0x185fa5, metalness: 0.05, roughness: 0.7 }));
      scene.add(mesh);
      // 重建合适大小的网格（1.6× 模型最大平面尺寸）
      const planMax = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
      scene.remove(grid);
      grid = new THREE.GridHelper(planMax * 1.6, 16, 0xcccccc, 0xe5e7eb);
      grid.position.y = -0.5; scene.add(grid);
      const r = Math.max(planMax, h);
      defaultView = { pos: [r * 0.9, r * 1.3, r * 0.9], target: [0, h * 0.25, 0] };
      camera.position.set(...defaultView.pos);
      controls.target.set(...defaultView.target); controls.update();
    });
    (function tick() { requestAnimationFrame(tick); renderer.render(scene, camera); })();
  } catch (e) {
    canvasBox.innerHTML = "<div style='padding:20px;color:#6b7280;font-size:12px'>"
      + "three.js 加载失败（" + e.message + "），已显示下方 OpenSCAD 渲染图作为兜底。</div>";
  }
}

function resetView() {
  if (!defaultView || !camera || !controls) return;
  camera.position.set(...defaultView.pos);
  controls.target.set(...defaultView.target);
  controls.update();
}
$("#reset-view").onclick = resetView;

loadData();
</script>
</body>
</html>
