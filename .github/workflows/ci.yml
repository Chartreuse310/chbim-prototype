name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 OpenSCAD 与 Python 依赖
        # openscad: 几何核心 CLI；reportlab: PDF 图纸；fontTools: SVG 字体子集嵌入；
        # trimesh: OBJ 兜底转换（apt 的 OpenSCAD 2021.01 不支持 .obj 导出）
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          pip install reportlab fontTools trimesh
      - name: 运行冒烟测试
        run: python -m unittest discover -s tests -v
